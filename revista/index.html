function show(n){cur=Math.max(0,Math.min(PAGES.length-1,n));const p=PAGES[cur];ph.style.display='flex';img.className='loading';img.onload=()=>{ph.style.display='none';img.className='loaded';};img.onerror=()=>{ph.innerHTML='<div style="text-align:center;padding:20px;font-size:12px;opacity:.6">Imagem nao encontrada.</div>';};img.src=p.url;lbl.textContent=p.rotulo;desc.textContent=p.conteudo;cNow.textContent=cur+1;prev.disabled=cur===0;next.disabled=cur===PAGES.length-1;if(cur+1<PAGES.length){const pi=new Image();pi.src=PAGES[cur+1].url;}}

let x0=null,y0=null;const fr=document.getElementById('frame');
