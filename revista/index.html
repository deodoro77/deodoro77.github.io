<style>
:root{--verde:#1d5c3a;--verde-esc:#0f3320;--ouro:#c8973a;--ouro-cl:#e4b96a;--ouro-pale:#f0d89a;--creme:#f5f0e8;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available;}
body{background:var(--verde-esc);font-family:'Source Sans 3',sans-serif;color:var(--creme);display:flex;flex-direction:column;height:100vh;height:100dvh;height:-webkit-fill-available;max-height:100vh;max-height:100dvh;overflow:hidden;width:100%;max-width:100vw;user-select:none;-webkit-user-select:none;}
header{flex:0 0 auto;background:linear-gradient(180deg,#0a2518 0%,var(--verde-esc) 100%);border-bottom:1px solid rgba(200,151,58,.3);padding:10px 16px 8px;text-align:center;position:relative;}
header .escola{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.35em;color:var(--ouro);text-transform:uppercase;opacity:.85;}
header h1{font-family:'Cinzel',serif;font-size:15px;font-weight:600;color:var(--ouro-pale);margin:3px 0 1px;line-height:1.2;letter-spacing:.04em;}
header .ano{font-family:'IM Fell English',serif;font-size:12px;color:var(--ouro-cl);font-style:italic;opacity:.8;}
.btn-idx{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:linear-gradient(180deg,var(--ouro) 0%,var(--ouro-cl) 100%);border:1px solid var(--ouro-pale);color:var(--verde-esc);font-family:'Cinzel',serif;font-size:10px;font-weight:700;letter-spacing:.18em;padding:8px 14px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);text-transform:uppercase;}
.btn-idx:active{transform:translateY(-50%) scale(.96);background:var(--ouro-cl);}
.btn-idx .idx-ico{font-size:14px;line-height:1;}
.stage{flex:1 1 0;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:4px 6px 0;gap:4px;}
.frame{position:relative;width:100%;max-width:520px;flex:1 1 0;min-height:0;background:#0a1f12;border:1px solid rgba(200,151,58,.35);border-radius:4px;overflow:hidden;box-shadow:0 0 0 3px rgba(200,151,58,.12),0 20px 50px rgba(0,0,0,.6);}
.frame img{width:100%;height:100%;object-fit:contain;display:block;background:#f2ede3;transition:opacity .25s;}
.frame img.loading{opacity:0;}.frame img.loaded{opacity:1;}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ouro-cl);}
.ring{width:36px;height:36px;border:3px solid rgba(200,151,58,.2);border-top-color:var(--ouro);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.hint-swipe{position:absolute;bottom:10px;width:100%;text-align:center;font-size:10px;color:rgba(200,151,58,.4);letter-spacing:.12em;text-transform:uppercase;pointer-events:none;transition:opacity .4s;}
.caption{flex:0 0 auto;text-align:center;padding:0 10px 2px;max-width:520px;width:100%;}
.lbl{display:inline-block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--verde-esc);background:var(--ouro-cl);padding:3px 14px;border-radius:20px;font-weight:600;margin-bottom:5px;}
.desc{font-family:'IM Fell English',serif;font-size:13px;color:rgba(245,240,232,.75);line-height:1.4;font-style:italic;min-height:18px;}
nav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--verde-esc) 70%,transparent);max-width:520px;width:100%;align-self:center;}
.btn-nav{flex:0 0 auto;background:var(--ouro);color:var(--verde-esc);border:none;font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.08em;padding:12px 18px;border-radius:6px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:transform .1s,background .1s;min-width:90px;text-align:center;}
.btn-nav:active{transform:scale(.97);background:var(--ouro-cl);}.btn-nav:disabled{opacity:.3;cursor:default;}
.counter{flex:1;text-align:center;}
.counter .big{font-family:'Cinzel',serif;font-size:22px;font-weight:600;color:var(--ouro-pale);display:block;line-height:1;}
.counter .tot{font-size:10px;color:rgba(200,151,58,.6);letter-spacing:.18em;}
.overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(10,32,20,.97);backdrop-filter:blur(4px);flex-direction:column;}
.overlay.open{display:flex;}
.ov-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid rgba(200,151,58,.2);}
.ov-head h2{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.25em;color:var(--ouro-cl);text-transform:uppercase;}
.btn-close{background:none;border:1px solid rgba(200,151,58,.3);color:var(--ouro-cl);font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.idx-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 30px;}

.idx-item:active{background:rgba(200,151,58,.08);}

</style>
</head>
