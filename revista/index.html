let cur=0;
const img=document.getElementById('img'),ph=document.getElementById('ph'),lbl=document.getElementById('lbl'),desc=document.getElementById('desc'),cNow=document.getElementById('cNow'),cTot=document.getElementById('cTot'),prev=document.getElementById('prev'),next=document.getElementById('next'),hint=document.getElementById('hint'),ov=document.getElementById('ov');
// cTot não usado
setTimeout(()=>hint.style.opacity='0',3000);
function show(n){cur=Math.max(0,Math.min(PAGES.length-1,n));const p=PAGES[cur];ph.style.display='flex';img.className='loading';img.onload=()=>{ph.style.display='none';img.className='loaded';};img.onerror=()=>{ph.innerHTML='<div style="text-align:center;padding:20px;font-size:12px;opacity:.6">Imagem nao encontrada.</div>';};img.src=p.url;lbl.textContent=p.rotulo;desc.textContent=p.conteudo;cNow.textContent=(cur+1)+' / '+PAGES.length;const pg=document.getElementById('cPg');if(pg)pg.textContent=p.rotulo;prev.disabled=cur===0;next.disabled=cur===PAGES.length-1;if(cur+1<PAGES.length){const pi=new Image();pi.src=PAGES[cur+1].url;}}
prev.onclick=()=>show(cur-1);next.onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')show(cur+1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')show(cur-1);});
let x0=null,y0=null;const fr=document.getElementById('frame');
fr.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
fr.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;const dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){if(dx<0)show(cur+1);else show(cur-1);}x0=y0=null;});
document.getElementById('btnIdx').onclick=()=>{const list=document.getElementById('idxList');if(!list.children.length){PAGES.forEach((p,i)=>{const a=document.createElement('div');a.className='idx-item';a.innerHTML='<span class="idx-n">'+(i+1)+'</span><span class="idx-pg">'+p.rotulo+'</span><span class="idx-desc">'+p.conteudo+'</span>';a.onclick=()=>{show(i);ov.classList.remove('open');};list.appendChild(a);});}ov.classList.add('open');};
document.getElementById('ovClose').onclick=()=>ov.classList.remove('open');
show(0);
